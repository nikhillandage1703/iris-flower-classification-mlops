stages:
  load_data:
    cmd: python src/data/load_data.py
    deps:
      - src/data/load_data.py
      - config/config.py
    params:
      - data_load.raw_data_path
    outs:
      - data/raw/iris.csv:
          cache: true

  validate_data:
    cmd: python src/data/validate_data.py
    deps:
      - src/data/validate_data.py
      - data/raw/iris.csv
      - config/config.py

  eda:
    cmd: python src/eda/generate_eda.py
    deps:
      - src/eda/generate_eda.py
      - data/raw/iris.csv
      - config/config.py
    outs:
      - reports/figures/class_distribution.png:
          cache: false
      - reports/figures/correlation_heatmap.png:
          cache: false
      - reports/figures/feature_comparison.png:
          cache: false
      - reports/figures/pairplot_comparison.png:
          cache: false

  preprocess:
    cmd: python src/features/preprocess.py
    deps:
      - src/features/preprocess.py
      - data/raw/iris.csv
      - config/config.py
    params:
      - preprocess.test_size
      - preprocess.random_state
      - preprocess.stratify
    outs:
      - data/processed/train.csv:
          cache: true
      - data/processed/test.csv:
          cache: true

  train_and_evaluate:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - src/models/evaluate.py
      - data/processed/train.csv
      - data/processed/test.csv
      - config/config.py
    params:
      - train.decision_tree
      - train.random_forest
      - mlflow.experiment_name
    outs:
      - models/best_model.joblib:
          cache: true
      - models/decision_tree.joblib:
          cache: true
      - models/random_forest.joblib:
          cache: true
      - models/model_metadata.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
